name: Docker Image CI

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "main.go"
      - "go.mod"
      - "go.sum"
      - "server/**"
      - "frontend/**"
      - "Makefile"
      - "Dockerfile"

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)